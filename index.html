<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Digest</title>

<!-- iOS home-screen app behaviour -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Daily Digest">
<meta name="theme-color" content="#efe9da">
<link rel="apple-touch-icon" href="icon.png">

<!-- Discourage any intermediate cache from serving stale shells. The real
     fix is the service worker below - this just helps browsers that respect
     these hints. -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<!-- Service worker: network-first for same-origin so Hard refresh actually
     refreshes on iOS PWAs. Registered before anything else loads. -->
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js', { scope: './' })
      .then(reg => {
        /* When a new SW takes over, auto-reload once so the user sees fresh code */
        let reloaded = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (reloaded) return; reloaded = true;
          window.location.reload();
        });
      })
      .catch(() => { /* ignore - app still works, Hard refresh button is fallback */ });
  }
</script>

<!-- KaTeX for formula rendering -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>

<!-- Chess rendering (chessboard.js needs jQuery; chess.js enforces legal moves) -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;0,9..144,800;1,9..144,400&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">

<style>
  :root{
    --paper:#efe9da; --paper-card:#f8f4e8; --ink:#211c14; --ink-soft:#5a5142;
    --muted:#8b8270; --line:#d8d0bc; --accent:#9a3b2e; --accent-soft:#c98a2e;
    --star:#c98a2e;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html{background:var(--paper);}
  body{
    font-family:'Newsreader',Georgia,serif; color:var(--ink);
    font-size:18px; line-height:1.55;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    -webkit-font-smoothing:antialiased;
    background:transparent;
    position:relative;
    min-height:100vh;
  }
  /* The actual artwork sits behind EVERYTHING as a fixed full-viewport
     layer, filtered to sepia/muted so it feels like an aged engraving
     rather than a photo, and heavily dimmed so it never competes with
     the cards for attention. The paintings themselves rotate daily - a
     JS hook (bgPainting) sets --bg-art to the chosen image's URL. */
  body::before{
    content:''; position:fixed; inset:0; z-index:-2; pointer-events:none;
    background-color:var(--paper);
    background-image: var(--bg-art, none);
    background-position:center center;
    background-size:cover;
    background-repeat:no-repeat;
    opacity:1;
    filter:sepia(55%) saturate(.65) contrast(.88) brightness(1.02);
  }
  /* Parchment veil + foxing + vignette + grain, all on a fixed overlay
     so it stays put while the content scrolls. The veil tames the artwork
     into a whisper; cards are opaque so they read as clearly as before. */
  body::after{
    content:''; position:fixed; inset:0; z-index:-1; pointer-events:none;
    background-image:
      /* scattered foxing - amber spots suggesting age */
      radial-gradient(ellipse 60px 40px at 12% 8%,  rgba(150,100,55,.055) 0%, transparent 70%),
      radial-gradient(ellipse 40px 55px at 88% 15%, rgba(150,100,55,.045) 0%, transparent 70%),
      radial-gradient(ellipse 50px 35px at 25% 45%, rgba(150,100,55,.04)  0%, transparent 70%),
      radial-gradient(ellipse 45px 60px at 75% 55%, rgba(150,100,55,.05)  0%, transparent 70%),
      radial-gradient(ellipse 55px 40px at 15% 82%, rgba(150,100,55,.045) 0%, transparent 70%),
      radial-gradient(ellipse 35px 50px at 90% 90%, rgba(150,100,55,.04)  0%, transparent 70%),
      radial-gradient(ellipse 30px 30px at 50% 30%, rgba(140,90,50,.03)   0%, transparent 70%),
      radial-gradient(ellipse 40px 40px at 60% 72%, rgba(140,90,50,.035)  0%, transparent 70%),
      /* edge vignette - darker at the margins, pulling the eye to centre */
      radial-gradient(ellipse at center, transparent 35%, rgba(60,40,20,.18) 100%),
      /* warm centred glow */
      radial-gradient(ellipse at 50% 20%, rgba(255,245,215,.25) 0%, transparent 55%),
      /* fine vertical laid-paper lines */
      repeating-linear-gradient(90deg,
        transparent 0, transparent 2px,
        rgba(90,81,66,.02) 2px, rgba(90,81,66,.02) 3px),
      /* heavy parchment veil - the layer that tames the painting */
      linear-gradient(rgba(239,233,218,.78) 0%, rgba(239,233,218,.82) 100%);
    background-size:100% 100%;
    background-repeat:no-repeat;
  }
  .wrap{max-width:660px;margin:0 auto;padding:22px 20px 80px;position:relative;}
  /* Decorative page ornaments: a flowing botanical fleuron at the very top
     above the masthead, and another at the bottom below the last card.
     Scrollwork emanating from a central diamond - classical/romantic feel. */
  .wrap::before{
    content:''; display:block; height:36px; margin:0 auto 4px;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 36'><g fill='none' stroke='%235a5142' stroke-width='0.9' stroke-linecap='round'><line x1='0' y1='18' x2='210' y2='18' opacity='0.4'/><line x1='390' y1='18' x2='600' y2='18' opacity='0.4'/><path d='M 220 18 Q 235 12, 250 18 Q 260 25, 272 22 Q 282 18, 285 10' opacity='0.75'/><path d='M 380 18 Q 365 12, 350 18 Q 340 25, 328 22 Q 318 18, 315 10' opacity='0.75'/><path d='M 220 18 Q 235 24, 250 18' opacity='0.5'/><path d='M 380 18 Q 365 24, 350 18' opacity='0.5'/><path d='M 290 18 L 295 13 L 300 18 L 295 23 Z' fill='%235a5142'/><path d='M 310 18 L 305 13 L 300 18 L 305 23 Z' fill='%235a5142'/><circle cx='300' cy='18' r='1.6' fill='%235a5142'/><circle cx='285' cy='10' r='1.1' fill='%235a5142'/><circle cx='315' cy='10' r='1.1' fill='%235a5142'/><path d='M 272 22 Q 265 28, 258 26' opacity='0.5'/><path d='M 328 22 Q 335 28, 342 26' opacity='0.5'/></g></svg>");
    background-repeat:no-repeat; background-position:center; background-size:contain;
    opacity:.75;
  }
  .wrap::after{
    content:''; display:block; height:44px; margin:28px auto 0;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 44'><g fill='none' stroke='%235a5142' stroke-width='0.9' stroke-linecap='round'><line x1='30' y1='22' x2='230' y2='22' opacity='0.35'/><line x1='370' y1='22' x2='570' y2='22' opacity='0.35'/><path d='M 240 22 Q 258 14, 275 22 Q 290 30, 300 22' opacity='0.8'/><path d='M 360 22 Q 342 14, 325 22 Q 310 30, 300 22' opacity='0.8'/><path d='M 240 22 Q 258 30, 275 22' opacity='0.55'/><path d='M 360 22 Q 342 30, 325 22' opacity='0.55'/><path d='M 275 22 Q 268 10, 258 6' opacity='0.6'/><path d='M 325 22 Q 332 10, 342 6' opacity='0.6'/><path d='M 275 22 Q 268 34, 258 38' opacity='0.6'/><path d='M 325 22 Q 332 34, 342 38' opacity='0.6'/><circle cx='300' cy='22' r='3' fill='%235a5142'/><circle cx='258' cy='6' r='1.3' fill='%235a5142'/><circle cx='342' cy='6' r='1.3' fill='%235a5142'/><circle cx='258' cy='38' r='1.3' fill='%235a5142'/><circle cx='342' cy='38' r='1.3' fill='%235a5142'/><circle cx='285' cy='22' r='1' fill='%235a5142'/><circle cx='315' cy='22' r='1' fill='%235a5142'/></g></svg>");
    background-repeat:no-repeat; background-position:center; background-size:contain;
    opacity:.6;
  }
  /* Between-card ornament - small centred fleuron that acts as a natural
     visual separator. Inserted by renderDay as a .card-sep div. */
  .card-sep{
    height:22px; margin:2px auto 14px;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 22'><g fill='none' stroke='%238b8270' stroke-width='0.7' stroke-linecap='round'><line x1='30' y1='11' x2='85' y2='11' opacity='0.5'/><line x1='115' y1='11' x2='170' y2='11' opacity='0.5'/><path d='M 90 11 Q 95 7, 100 11 Q 95 15, 90 11 Z' fill='%238b8270'/><path d='M 110 11 Q 105 7, 100 11 Q 105 15, 110 11 Z' fill='%238b8270'/><circle cx='100' cy='11' r='1.4' fill='%238b8270'/></g></svg>");
    background-repeat:no-repeat; background-position:center; background-size:contain;
    opacity:.65;
  }

  /* ---- header ---- */
  header{margin-bottom:18px;}
  .kicker{
    font-family:'Fraunces',serif; font-size:12px; letter-spacing:.22em;
    text-transform:uppercase; color:var(--accent); font-weight:600;
  }
  .masthead{
    font-family:'Fraunces',serif; font-weight:600; font-size:40px;
    line-height:1.04; letter-spacing:-.02em; margin:2px 0 4px;
  }
  .date-line{font-size:16px; color:var(--ink-soft); font-style:italic;}
  /* Fleuron divider: a centered classical ornament (diamond + leaf flourishes)
     flanked by hairlines. Replaces the plain black bar. */
  .hr{
    height:22px; background:none; margin:14px 0 4px;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 22'><g fill='none' stroke='%23211c14' stroke-width='0.8'><line x1='0' y1='11' x2='155' y2='11'/><line x1='245' y1='11' x2='400' y2='11'/><path d='M 175 11 Q 190 3, 198 11 Q 190 19, 175 11 Z' fill='%23211c14'/><path d='M 225 11 Q 210 3, 202 11 Q 210 19, 225 11 Z' fill='%23211c14'/><circle cx='200' cy='11' r='2' fill='%23211c14'/></g></svg>");
    background-repeat:no-repeat; background-position:center; background-size:100% 22px;
  }
  .hr.thin{
    height:1px; background:var(--line); background-image:none;
  }

  /* ---- nav ---- */
  nav{display:flex;gap:6px;margin:16px 0 22px;}
  nav button{
    flex:1; font-family:'Fraunces',serif; font-size:13px; font-weight:500;
    letter-spacing:.04em; padding:9px 4px; background:transparent;
    border:1px solid var(--line); border-radius:2px; color:var(--ink-soft);
    cursor:pointer; transition:.15s;
  }
  nav button.active{background:var(--ink);color:var(--paper);border-color:var(--ink);}

  /* ---- cards ---- */
  .card{
    background:var(--paper-card); border:1px solid var(--line);
    border-radius:3px; padding:18px 18px 16px; margin-bottom:16px;
    box-shadow:0 1px 0 rgba(0,0,0,.04), 0 6px 18px -14px rgba(0,0,0,.5);
    position:relative; animation:rise .4s ease both;
  }
  /* Classical corner brackets - small engraved L-brackets at each corner,
     evoking an aldine/roman book plate frame. Low opacity + muted colour so
     they read as 'pressed into the paper', not decoration layered on top. */
  .card::before, .card::after{
    content:''; position:absolute; width:18px; height:18px;
    pointer-events:none; opacity:.55;
    background-color:var(--ink-soft);
    -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat;
    -webkit-mask-size:contain; mask-size:contain;
  }
  .card::before{
    top:5px; left:5px;
    -webkit-mask-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 18 18'><g fill='none' stroke='black' stroke-width='1'><path d='M 1 1 L 1 13 M 1 1 L 13 1'/><path d='M 4 4 L 4 10 M 4 4 L 10 4'/><circle cx='1' cy='1' r='1.2' fill='black'/></g></svg>");
            mask-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 18 18'><g fill='none' stroke='black' stroke-width='1'><path d='M 1 1 L 1 13 M 1 1 L 13 1'/><path d='M 4 4 L 4 10 M 4 4 L 10 4'/><circle cx='1' cy='1' r='1.2' fill='black'/></g></svg>");
  }
  .card::after{
    bottom:5px; right:5px;
    -webkit-mask-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 18 18'><g fill='none' stroke='black' stroke-width='1'><path d='M 17 17 L 17 5 M 17 17 L 5 17'/><path d='M 14 14 L 14 8 M 14 14 L 8 14'/><circle cx='17' cy='17' r='1.2' fill='black'/></g></svg>");
            mask-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 18 18'><g fill='none' stroke='black' stroke-width='1'><path d='M 17 17 L 17 5 M 17 17 L 5 17'/><path d='M 14 14 L 14 8 M 14 14 L 8 14'/><circle cx='17' cy='17' r='1.2' fill='black'/></g></svg>");
  }
  @keyframes rise{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
  .card-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px;}
  .list-tag{
    font-family:'Fraunces',serif; font-size:12px; letter-spacing:.18em;
    text-transform:uppercase; color:var(--accent); font-weight:800;
  }
  .star{
    background:none;border:none;cursor:pointer;font-size:22px;line-height:1;
    color:var(--line); padding:0 2px; transition:.15s;
  }
  .star.on{color:var(--star);transform:scale(1.05);}
  .item-title{
    font-family:'Fraunces',serif; font-weight:600; font-size:27px;
    line-height:1.12; letter-spacing:-.01em; margin-bottom:3px;
  }
  .pron{font-style:italic;color:var(--muted);font-size:15px;margin-bottom:8px;}
  .card-body{font-size:17.5px;}
  .card-body p{margin:7px 0;}
  .pos{
    font-family:'Fraunces',serif;font-style:italic;color:var(--accent);
    font-size:15px;font-weight:500;
  }
  .subhead{
    font-family:'Fraunces',serif;font-weight:600;font-size:16px;
    margin:12px 0 2px;
  }
  .formula{
    margin:13px 0 4px;padding:11px 12px;background:#fff;border:1px solid var(--line);
    border-radius:2px;overflow-x:auto;text-align:center;
  }
  .formula .katex{font-size:1.05em;}
  .more-btn{
    margin-top:12px;font-family:'Fraunces',serif;font-size:13px;font-weight:500;
    letter-spacing:.03em;background:none;border:none;color:var(--accent);
    cursor:pointer;padding:4px 0;border-bottom:1px solid var(--accent);
  }
  .more-body{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:16.5px;}
  .more-body p{margin:6px 0;}
  a.link{color:var(--accent);text-decoration:none;border-bottom:1px solid var(--line);}
  .loading{color:var(--muted);font-style:italic;}
  .errline{color:var(--accent);font-size:15px;}
  .retry{
    margin-left:8px;font-family:'Fraunces',serif;font-size:13px;background:none;
    border:1px solid var(--line);border-radius:2px;padding:2px 8px;cursor:pointer;color:var(--ink-soft);
  }
  .ex{font-style:italic;color:var(--ink-soft);}

  /* ---- card thumbnail (small Wikipedia image, top-right of body) ---- */
  .card-thumb{
    float:right; width:96px; height:96px; margin:0 0 10px 14px;
    border:1px solid var(--line); border-radius:2px;
    object-fit:cover; background:#fff;
    box-shadow:0 1px 2px rgba(0,0,0,.08);
    cursor:zoom-in;
  }
  @media (max-width: 380px){
    .card-thumb{ width:76px; height:76px; margin:0 0 8px 10px; }
  }
  /* clear float at end of body so Tell-me-more sits below cleanly */
  .card-body::after{ content:""; display:block; clear:both; }

  /* ---- fullscreen image viewer (tap a thumbnail to expand) ---- */
  .lightbox{
    position:fixed; inset:0; background:rgba(0,0,0,.92);
    display:flex; align-items:center; justify-content:center;
    z-index:9999; cursor:zoom-out;
    padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
    animation:fadeIn .18s ease;
  }
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  .lightbox img{
    max-width:100%; max-height:100%; object-fit:contain;
    box-shadow:0 10px 40px rgba(0,0,0,.5);
    background:#fff;
  }
  .lightbox-close{
    position:absolute; top:calc(env(safe-area-inset-top) + 12px); right:16px;
    background:rgba(255,255,255,.12); color:#fff; border:1px solid rgba(255,255,255,.3);
    width:36px; height:36px; border-radius:50%; font-size:22px; line-height:1;
    cursor:pointer; display:flex; align-items:center; justify-content:center;
  }

  /* ---- reference banner (top of Today view) ---- */
  .ref-banner{
    margin:0 0 16px; padding:10px 12px;
    background:var(--paper-card); border:1px solid var(--line); border-radius:2px;
    display:flex; align-items:center; gap:12px; flex-wrap:wrap;
    border-left:3px solid var(--accent-soft);
    overflow:hidden;
  }
  .ref-banner-label{
    font-family:'Fraunces',serif; font-weight:500; font-size:13px;
    letter-spacing:.04em; color:var(--ink-soft); flex-shrink:0;
  }
  .ref-banner-formula{
    overflow-x:auto; flex:1 1 100%; min-width:0; max-width:100%;
    -webkit-overflow-scrolling:touch;
    padding:2px 0;
  }
  .ref-banner-formula .katex{font-size:.95em; white-space:nowrap;}
  .ref-banner-value{
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:13px; color:var(--ink);
  }
  /* on phone-portrait widths, stack label on top so the formula gets full width */
  @media (max-width: 520px){
    .ref-banner{ flex-direction:column; align-items:stretch; gap:6px; padding:9px 10px; }
    .ref-banner-label{ font-size:12px; }
  }

  /* ---- pull-to-refresh indicator ---- */
  .pull-indicator{
    position:fixed; left:0; right:0; top:0;
    display:flex; align-items:center; justify-content:center;
    pointer-events:none; z-index:50;
    font-family:'Fraunces',serif; font-size:13px; color:var(--ink-soft);
    letter-spacing:.06em; text-transform:uppercase;
    background:var(--paper);
    transform:translateY(-100%);
    transition:transform 0s;
    will-change:transform,opacity;
  }
  .pull-indicator.spinning{
    animation:pullspin 1.1s linear infinite;
  }
  @keyframes pullspin{
    0%{opacity:.4;} 50%{opacity:1;} 100%{opacity:.4;}
  }

  /* ---- artworks ---- */
  .artwork-image{
    margin:10px auto 8px; text-align:center; min-height:120px;
    display:flex; align-items:center; justify-content:center;
    background:#fff; border:1px solid var(--line); border-radius:2px;
    padding:6px;
  }
  .artwork-image img{
    max-width:100%; max-height:380px; height:auto; display:block;
    cursor:zoom-in;
  }
  .artwork-caption{
    font-family:'Fraunces',serif; font-style:italic; font-size:15px;
    color:var(--ink-soft); text-align:center; margin:4px 2px 2px;
  }

  /* ---- quotes ---- */
  .quote-body{
    font-family:'Fraunces',serif; font-weight:400; font-size:22px;
    line-height:1.38; letter-spacing:-.005em;
    color:var(--ink); margin:14px 4px 10px;
    padding-left:14px; border-left:3px solid var(--accent-soft);
    font-style:italic;
  }
  .quote-body::before{
    content:'\201C'; font-family:'Fraunces',serif; font-size:40px;
    line-height:0; vertical-align:-12px; margin-right:2px;
    color:var(--accent-soft);
  }
  .quote-body::after{
    content:'\201D'; font-family:'Fraunces',serif; font-size:40px;
    line-height:0; vertical-align:-18px; margin-left:2px;
    color:var(--accent-soft);
  }
  .quote-author{
    font-family:'Fraunces',serif; font-size:14px; letter-spacing:.04em;
    color:var(--ink-soft); text-align:right; margin:4px 8px 6px;
  }

  /* ---- chess board ---- */
  .chess-wrap{margin:14px 0 4px;}
  .chess-board{
    width:100%; max-width:340px; margin:0 auto 10px;
    border:1px solid var(--line); background:var(--paper-card); padding:2px;
    border-radius:2px;
  }
  .chess-board .white-1e1d7{background:#f3ead1 !important;}
  .chess-board .black-3c85d{background:#9a7f4a !important;}
  .chess-board .highlight-white{box-shadow:inset 0 0 0 3px var(--accent-soft) !important;}
  .chess-board .highlight-black{box-shadow:inset 0 0 0 3px var(--accent-soft) !important;}
  .chess-caption{
    font-family:'Newsreader',serif; font-style:italic; color:var(--ink-soft);
    font-size:15px; text-align:center; margin:0 0 8px;
  }
  .chess-controls{
    display:flex; gap:6px; justify-content:center; margin-bottom:4px; flex-wrap:wrap;
  }
  .chess-controls button{
    font-family:'Fraunces',serif; font-size:13px; font-weight:500;
    padding:6px 12px; min-width:44px;
    background:transparent; border:1px solid var(--line); border-radius:2px;
    color:var(--ink-soft); cursor:pointer; transition:.12s;
  }
  .chess-controls button:hover{background:var(--paper-card); color:var(--ink);}
  .chess-controls button:disabled{opacity:.35; cursor:default;}
  .chess-controls button.on{background:var(--ink); color:var(--paper); border-color:var(--ink);}
  .chess-movelabel{

<body>
<div class="wrap" id="app"></div>
<input type="file" id="importer" accept="application/json" style="display:none">

<!-- ============ DATA ============ -->
<script>
  /* Load lists.js with the same ?v= cache-buster as index.html so Hard refresh
     actually forces a fresh download of the data file, not just the shell. */
  (function(){
    var v = new URLSearchParams(location.search).get('v') || '';
    var q = v ? '?v=' + encodeURIComponent(v) : '';
    document.write('<script src="lists.js' + q + '"><\/script>');
  })();
</script>

<!-- ============ ENGINE ============ -->
<script>
"use strict";

/* ---------- deterministic RNG ---------- */
function hashStr(str){
  str=String(str); let h=1779033703^str.length;
  for(let i=0;i<str.length;i++){
    h=Math.imul(h^str.charCodeAt(i),3432918353);
    h=(h<<13)|(h>>>19);
  }
  h=Math.imul(h^(h>>>16),2246822507);
  h=Math.imul(h^(h>>>13),3266489909);
  return (h^(h>>>16))>>>0;
}
function mulberry32(a){
  return function(){
    a|=0; a=(a+0x6D2B79F5)|0;
    let t=Math.imul(a^(a>>>15),1|a);
    t=(t+Math.imul(t^(t>>>7),61|t))^t;
    return ((t^(t>>>14))>>>0)/4294967296;
  };
}
function weightedPick(items,weightFn,rng){
  let total=0; for(const it of items) total+=weightFn(it);
  let r=rng()*total;
  for(const it of items){ r-=weightFn(it); if(r<=0) return it; }
  return items[items.length-1];
}

/* ---------- dates ---------- */
function ymd(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function todayStr(){ return ymd(new Date()); }
function daysBetween(a,b){
  return Math.round((Date.parse(b+'T00:00:00')-Date.parse(a+'T00:00:00'))/86400000);
}
function prettyDate(s){
  const d=new Date(s+'T00:00:00');
  return d.toLocaleDateString(undefined,{weekday:'long',year:'numeric',month:'long',day:'numeric'});
}

/* ---------- build normalized lists ---------- */
function buildLists(){
  const out=[];
  for(const raw of (window.APP_LISTS||[])){
    /* reference list is for the Reference tab only, not the daily digest */
    if(raw.type==='reference') continue;
    if(raw.type==='word'){
      const items=[];
      (raw.simple||[]).forEach(w=>items.push({id:w,forms:[w],weight:1}));
      (raw.weighted||[]).forEach(w=>items.push({id:w,forms:[w],weight:2}));
      (raw.groups||[]).forEach(g=>items.push({id:g[0],forms:g.slice(),weight:2}));
      (raw.noDef||[]).forEach(w=>items.push({id:w,forms:[w],weight:1,noDef:true}));
      out.push({id:raw.id,name:raw.name,type:'word',items});
    }else if(raw.type==='quote'){
      /* each quote gets a stable id from first 40 chars (dedupe-safe within a list) */
      const items=(raw.items||[]).map(it=>({
        id: it.id || it.text.slice(0,40),
        text: it.text,
        author: it.author || null,
        weight: 1
      }));
      out.push({id:raw.id,name:raw.name,type:'quote',items});
    }else if(raw.type==='artwork'){
      const items=(raw.items||[]).map(it=>({
        id: it.name,
        name: it.name,
        titles: it.titles || [it.name],
        imageUrl: it.imageUrl || null,
        weight: 1
      }));
      out.push({id:raw.id,name:raw.name,type:'artwork',items});
    }else{
      /* wiki type: pass through optional fen/pgn/caption so chess items render
         their board correctly, and formula so cards with abrupt Wikipedia
         extracts can still show the math. */
      const items=(raw.items||[]).map(it=>({
        id:it.name, name:it.name, titles:it.titles||[it.name],
        formula:it.formula||null,
        fen:it.fen||null, pgn:it.pgn||null, caption:it.caption||null,
        weight:1
      }));
      out.push({id:raw.id,name:raw.name,type:'wiki',items});
    }
  }
  return out;
}
const LISTS=buildLists();
function getList(id){ return LISTS.find(l=>l.id===id); }
function getItem(list,itemId){ return list?list.items.find(i=>i.id===itemId):null; }

/* ---------- state ---------- */
let state;
function loadState(){
  try{ state=JSON.parse(localStorage.getItem('dd_state')); }catch(e){ state=null; }
  if(!state||typeof state!=='object') state={};
  if(typeof state.seed!=='number') state.seed=Math.floor(Math.random()*4294967296);
  if(!Array.isArray(state.history)) state.history=[];
  if(!state.stars||typeof state.stars!=='object') state.stars={};
  /* refreshCounts[date] bumps each time the user pull-refreshes, giving
     deterministic-but-new selections for that date. */
  if(!state.refreshCounts||typeof state.refreshCounts!=='object') state.refreshCounts={};
}
function refreshSalt(date){ return state.refreshCounts[date]||0; }
function saveState(){ localStorage.setItem('dd_state',JSON.stringify(state)); }
function starKey(listId,itemId){ return listId+'::'+itemId; }
function isStarred(listId,itemId){ return !!state.stars[starKey(listId,itemId)]; }
function toggleStar(listId,itemId){
  const k=starKey(listId,itemId);
  if(state.stars[k]) delete state.stars[k]; else state.stars[k]=true;
  saveState();
}

/* ---------- selection ---------- */
function cooldownDays(listSize){
  return Math.min(14,Math.max(1,Math.floor(listSize*0.7)));
}
/* a day's picks for a list may be stored as a string (old format / single pick)
   or an array (multiple picks). Always read through idsOf(). */
function idsOf(entry,listId){
  const v=entry.picks[listId];
  if(!v) return [];
  return Array.isArray(v)?v:[v];
}
/* Word-list cycle with decaying weights: every draw halves a word's weight,
   and below 1x it goes inactive until the cycle ends. So per cycle:
   normal 1x -> out (1 draw); weighted 2x -> 1x -> out (2 draws);
   starred normal 2x -> 1x -> out (2); starred weighted 4x -> 2x -> 1x -> out (3).
   Nothing persists at elevated odds, so nothing smothers the stragglers,
   and the cycle length is a fixed count of draws. */
function drawCap(effW){ let n=0; while(effW>=1){ n++; effW/=2; } return n; }
function wordCycleInfo(list,date){
  const capOf={}; let totalCap=0;
  for(const it of list.items){
    capOf[it.id]=drawCap(it.weight*(isStarred(list.id,it.id)?2:1));
    totalCap+=capOf[it.id];
  }
  let cnt={}, used=0;
  for(const h of state.history){
    if(daysBetween(h.date,date)<=0) break;
    for(const id of idsOf(h,list.id)){
      if(capOf[id]===undefined) continue;
      cnt[id]=(cnt[id]||0)+1;
      if(cnt[id]<=capOf[id]) used++;
      if(used>=totalCap){ cnt={}; used=0; } /* cycle complete: all return */
    }
  }
  return {cnt:cnt,capOf:capOf};
}
function dailyCount(list,date){
  if(list.type!=='word') return 1;
  /* total turns in one full cycle (normal 1, weighted 2, starred 2, both 3),
     divided over a year and rounded UP to a fixed whole number per day.
     Grows automatically as words are added; hard cap of 5 a day. */
  let total=0;
  for(const it of list.items) total+=drawCap(it.weight*(isStarred(list.id,it.id)?2:1));
  return Math.max(1,Math.min(5,Math.ceil(total/365)));
}
function selectForList(list,date){
  const S=list.items.length;
  if(S===0) return [];
  const cd=cooldownDays(S);
  const recent=new Set();
  for(const h of state.history){
    const diff=daysBetween(h.date,date);
    if(diff>0&&diff<=cd){ idsOf(h,list.id).forEach(id=>recent.add(id)); }
  }
  const count=Math.min(dailyCount(list,date),S);
  const rng=mulberry32(hashStr(state.seed+'|'+date+'|'+list.id+'|'+refreshSalt(date)));
  const wf=it=>it.weight*(isStarred(list.id,it.id)?2:1);
  const info=list.type==='word'?wordCycleInfo(list,date):null;
  /* current-cycle weight: halves per draw this cycle; <1 means inactive */
  const cw=it=>wf(it)/Math.pow(2,(info&&info.cnt[it.id])||0);
  const picked=[],pickedSet=new Set();
  for(let i=0;i<count;i++){
    let eligible=list.items.filter(it=>
      !pickedSet.has(it.id)&&
      (isStarred(list.id,it.id)||!recent.has(it.id))&&
      (!info||cw(it)>=1));
    if(eligible.length===0) eligible=list.items.filter(it=>!pickedSet.has(it.id));
    if(eligible.length===0) break;
    const p=weightedPick(eligible,info?cw:wf,rng);
    picked.push(p); pickedSet.add(p.id);
    if(info) info.cnt[p.id]=(info.cnt[p.id]||0)+1;
  }
  return picked;
}
function computeDay(date){
  let entry=state.history.find(h=>h.date===date);
  if(entry) return entry;
  entry={date:date,picks:{}};
  for(const list of LISTS){
    const picks=selectForList(list,date);
    if(picks.length===1) entry.picks[list.id]=picks[0].id;
    else if(picks.length>1) entry.picks[list.id]=picks.map(p=>p.id);
  }
  state.history.push(entry);
  state.history.sort((a,b)=>a.date<b.date?-1:1);
  saveState();
  return entry;
}
/* how many times an item was picked strictly before `date` (for word-form rotation) */
function priorPickCount(listId,itemId,date){
  let n=0;
  for(const h of state.history){
    if(daysBetween(h.date,date)>0 && idsOf(h,listId).indexOf(itemId)!==-1) n++;
  }
  return n;
}

/* ---------- network with cache ---------- */
function getCache(){ try{return JSON.parse(localStorage.getItem('dd_cache')||'{}');}catch(e){return {};} }
function setCache(c){ try{localStorage.setItem('dd_cache',JSON.stringify(c));}catch(e){} }
/* re-reads before writing so parallel fetches don't clobber each other;
   prunes oldest entries so the cache can't grow without bound */
function cachePut(url,data){
  const c=getCache();
  c[url]=data;
  const keys=Object.keys(c);
  if(keys.length>1500){ for(let i=0;i<keys.length-1200;i++) delete c[keys[i]]; }
  setCache(c);
}
async function fetchJSON(url,allow404){
  const cache=getCache();
  if(cache[url]!==undefined) return cache[url];
  const res=await fetch(url);
  if(!res.ok){
    if(allow404 && res.status===404){
      const data=await res.json().catch(()=>({notfound:true}));
      data.__notfound=true; cachePut(url,data); return data;
    }
    throw new Error('HTTP '+res.status);
  }
  const data=await res.json();
  cachePut(url,data);
  return data;
}
const DICT='https://api.dictionaryapi.dev/api/v2/entries/en/';
const WIKI='https://en.wikipedia.org/api/rest_v1/page/summary/';
/* For math rescue: fetch the parsed intro HTML (section 0) which preserves
   math equations. The /page/summary/ endpoint strips math entirely. */
const WIKI_PARSE='https://en.wikipedia.org/w/api.php?action=parse&format=json&origin=*&prop=text&section=0&page=';

/* ---------- helpers ---------- */
function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
function esc(s){ return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function gsearch(q){ return 'https://www.google.com/search?q='+encodeURIComponent(q); }

/* ---------- card rendering ---------- */
function cardEl(list,item,date){
  const card=document.createElement('article');
  card.className='card';
  const starred=isStarred(list.id,item.id);

  /* word-form rotation */
  let displayForm=item.id, title;
  if(list.type==='word'){
    const forms=item.forms||[item.id];
    displayForm=forms[priorPickCount(list.id,item.id,date)%forms.length];
    title=cap(displayForm);
  }else{
    title=item.name;
  }

  /* artwork: image + name only, no synopsis */
  if(list.type==='artwork'){
    card.innerHTML=
      '<div class="card-top">'+
        '<span class="list-tag">'+esc(list.name)+'</span>'+
        '<button class="star'+(starred?' on':'')+'" aria-label="favourite">'+(starred?'\u2605':'\u2606')+'</button>'+
      '</div>'+
      '<div class="artwork-image"><span class="loading">Loading\u2026</span></div>'+
      '<div class="artwork-caption">'+esc(item.name)+'</div>';
    const starBtn=card.querySelector('.star');
    starBtn.addEventListener('click',()=>{
      toggleStar(list.id,item.id);
      const on=isStarred(list.id,item.id);
      starBtn.classList.toggle('on',on);
      starBtn.textContent=on?'\u2605':'\u2606';
    });
    fillArtwork(card,list,item);
    return card;
  }

  /* quotes: no title \u2014 the quote is the content */
  if(list.type==='quote'){
    card.innerHTML=
      '<div class="card-top">'+
        '<span class="list-tag">'+esc(list.name)+'</span>'+
        '<button class="star'+(starred?' on':'')+'" aria-label="favourite">'+(starred?'\u2605':'\u2606')+'</button>'+
      '</div>'+
      '<blockquote class="quote-body">'+esc(item.text)+'</blockquote>'+
      (item.author?'<div class="quote-author">\u2014 '+esc(item.author)+'</div>':'');
    const starBtn=card.querySelector('.star');
    starBtn.addEventListener('click',()=>{
      toggleStar(list.id,item.id);
      const on=isStarred(list.id,item.id);
      starBtn.classList.toggle('on',on);
      starBtn.textContent=on?'\u2605':'\u2606';
    });
    return card;
  }

  card.innerHTML=
    '<div class="card-top">'+
      '<span class="list-tag">'+esc(list.name)+'</span>'+
      '<button class="star'+(starred?' on':'')+'" aria-label="favourite">'+(starred?'\u2605':'\u2606')+'</button>'+
    '</div>'+
    '<h2 class="item-title">'+esc(title)+'</h2>'+
    '<div class="card-body"><span class="loading">Gathering\u2026</span></div>'+
    '<div class="formula" style="display:none"></div>'+
    '<div class="chess-wrap" style="display:none"></div>'+
    '<button class="more-btn" style="display:none">Tell me more</button>'+
    '<div class="more-body" hidden></div>';

  const starBtn=card.querySelector('.star');
  starBtn.addEventListener('click',()=>{
    toggleStar(list.id,item.id);
    const on=isStarred(list.id,item.id);
    starBtn.classList.toggle('on',on);
    starBtn.textContent=on?'\u2605':'\u2606';
  });

  if(list.type==='word') fillWord(card,list,item,displayForm);
  else fillWiki(card,list,item);

  return card;
}

/* ---- words ---- */
/* Keep short usage phrases; drop long literary citations (which the Dictionary API
   occasionally returns instead of a usage example). Heuristic: cap at 140 chars. */
function goodExample(s){
  if(!s) return false;
  s = String(s).trim();
  if(s.length > 140) return false;
  return true;
}

async function fillWord(card,list,item,form){
  const body=card.querySelector('.card-body');
  const moreBtn=card.querySelector('.more-btn');
  const moreBody=card.querySelector('.more-body');

  if(item.noDef){
    body.innerHTML='<p>No standard definition found for this entry.</p>';
    moreBtn.style.display='';
    moreBtn.textContent='Look it up';
    moreBtn.addEventListener('click',()=>{
      window.open(gsearch(form+' definition'),'_blank');
    });
    return;
  }
  try{
    const data=await fetchJSON(DICT+encodeURIComponent(form),true);
    if(data.__notfound||!Array.isArray(data)){
      body.innerHTML='<p>No dictionary entry found.</p>';
      moreBtn.style.display=''; moreBtn.textContent='Search the web';
      moreBtn.addEventListener('click',()=>window.open(gsearch(form+' definition'),'_blank'));
      return;
    }
    const entry=data[0];
    const phon=(entry.phonetic||(entry.phonetics||[]).map(p=>p.text).find(Boolean)||'');
    let html='';
    if(phon) html='<div class="pron">'+esc(phon)+'</div>';
    const meanings=entry.meanings||[];
    /* main: first meaning, up to 2 definitions */
    const m0=meanings[0];
    if(m0){
      html+='<p><span class="pos">'+esc(m0.partOfSpeech)+'</span></p>';
      m0.definitions.slice(0,2).forEach(d=>{
        html+='<p>'+esc(d.definition)+'</p>';
        if(d.example && goodExample(d.example)) html+='<p class="ex">\u201c'+esc(d.example)+'\u201d</p>';
      });
    }
    body.innerHTML=html||'<p>Definition unavailable.</p>';

    /* more: remaining meanings + link */
    let more='';
    meanings.forEach((m,mi)=>{
      const defs=(mi===0)?m.definitions.slice(2):m.definitions;
      if(defs.length===0 && mi===0) return;
      if(defs.length){
        more+='<p><span class="pos">'+esc(m.partOfSpeech)+'</span></p>';
        defs.slice(0,4).forEach(d=>{
          more+='<p>'+esc(d.definition)+'</p>';
          if(d.example && goodExample(d.example)) more+='<p class="ex">\u201c'+esc(d.example)+'\u201d</p>';
        });
      }
    });
    more+='<p><a class="link" target="_blank" href="'+gsearch(form+' meaning origin')+'">Search the web for more \u2192</a></p>';
    moreBody.innerHTML=more;
    moreBtn.style.display='';
    moreBtn.addEventListener('click',()=>{
      const hid=moreBody.hasAttribute('hidden');
      if(hid){moreBody.removeAttribute('hidden');moreBtn.textContent='Show less';}
      else{moreBody.setAttribute('hidden','');moreBtn.textContent='Tell me more';}
    });
  }catch(e){
    showError(body,()=>fillWord(card,list,item,form));
  }
}

/* ---- wiki (people / laws / machines) ---- */
async function fillWiki(card,list,item){
  const body=card.querySelector('.card-body');
  const formulaBox=card.querySelector('.formula');
  const moreBtn=card.querySelector('.more-btn');
  const moreBody=card.querySelector('.more-body');
  const titles=item.titles||[item.name];
  try{
    const results=await Promise.all(titles.map(async t=>({
      title:t, data:await fetchJSON(WIKI+encodeURIComponent(t.replace(/ /g,'_')),true)
    })));
    let html='',links=[];
    /* Small thumbnail: only for single-article cards (not bundles), and only
       when Wikipedia provides one. Floated top-right of the body so text wraps.
       Prefer the original if it's an animated GIF (Wikipedia's thumbnailer
       flattens GIFs to static JPEGs in `thumbnail.source`); otherwise use the
       pre-sized thumbnail. Tap-to-expand always uses the full-res original. */
    let thumbUrl = '', fullUrl = '';
    if(results.length===1 && results[0].data){
      const d = results[0].data;
      const orig = d.originalimage && d.originalimage.source;
      const thumb = d.thumbnail && d.thumbnail.source;
      if(orig && /\.gif($|\?)/i.test(orig)){
        thumbUrl = orig; fullUrl = orig;
      } else if(thumb){
        thumbUrl = thumb; fullUrl = orig || thumb;
      }
    }
    if(thumbUrl){
      html += '<img class="card-thumb" src="'+esc(thumbUrl)+'" '+
              'data-full="'+esc(fullUrl)+'" '+
              'alt="" referrerpolicy="no-referrer" onerror="this.remove()">';
    }
    results.forEach(r=>{
      if(titles.length>1) html+='<p class="subhead">'+esc(r.data.title||r.title)+'</p>';
      if(r.data.__notfound||!r.data.extract){
        html+='<p class="errline">No Wikipedia summary found for \u201c'+esc(r.title)+'\u201d.</p>';
      }else{
        html+='<p>'+esc(r.data.extract)+'</p>';
      }
      const url=r.data&&r.data.content_urls&&r.data.content_urls.desktop&&r.data.content_urls.desktop.page;
      links.push({label:r.data.title||r.title,url:url||('https://en.wikipedia.org/wiki/'+encodeURIComponent(r.title.replace(/ /g,'_')))});
    });
    body.innerHTML=html;

    /* formula: explicit per-item formula wins. Otherwise, if the Wikipedia
       extract looks abruptly truncated (ends in a trailing colon, equals sign
       etc. — Wikipedia stripped the equation that was there), auto-rescue
       the formula from the parsed article HTML. */
    if(item.formula){
      renderFormula(formulaBox,item.formula);
    } else {
      /* only run the rescue for single-article cards (not bundles) */
      if(results.length===1 && results[0].data && results[0].data.extract){
        const txt = results[0].data.extract.trim();
        if(/[:=\(]$|\\$/.test(txt)){
          rescueFormula(titles[0]).then(latex=>{
            if(latex) renderFormula(formulaBox, latex);
          });
        }
      }
    }

    /* chess board */
    if(item.fen || item.pgn){
      const chessBox=card.querySelector('.chess-wrap');
      chessBox.style.display='';
      renderChessBoard(chessBox,item);
    }

    /* tell me more -> wikipedia article links */
    let more='<p>Read the full article'+(links.length>1?'s':'')+':</p>';
    links.forEach(l=>{
      more+='<p><a class="link" target="_blank" href="'+esc(l.url)+'">'+esc(l.label)+' on Wikipedia \u2192</a></p>';
    });
    moreBody.innerHTML=more;
    moreBtn.style.display='';
    moreBtn.addEventListener('click',()=>{
      const hid=moreBody.hasAttribute('hidden');
      if(hid){moreBody.removeAttribute('hidden');moreBtn.textContent='Show less';}
      else{moreBody.setAttribute('hidden','');moreBtn.textContent='Tell me more';}
    });
  }catch(e){
    showError(body,()=>fillWiki(card,list,item));
  }
}

/* ---- Auto-rescue formula for cards where the Wikipedia summary API stripped
   the math (common pattern: extract ends in ":" or "="). Fetches the parsed
   intro HTML section via the Action API, which preserves math as fallback
   images carrying LaTeX in their `alt` attribute. Returns the first formula
   found as a LaTeX string, or null. ---- */
async function rescueFormula(title){
  try{
    const data = await fetchJSON(WIKI_PARSE+encodeURIComponent(title.replace(/ /g,'_')), true);
    if(!data || data.__notfound || !data.parse || !data.parse.text) return null;
    const html = data.parse.text['*'];
    if(!html) return null;
    const parser = new DOMParser();
    const doc = parser.parseFromString(html, 'text/html');
    /* Wikipedia renders math as <img class="mwe-math-fallback-image-..."> with
       the LaTeX source in the alt attribute. There's also an inline MathML
       sibling but the img alt is the cleanest LaTeX source. */
    const imgs = doc.querySelectorAll('img.mwe-math-fallback-image-inline, img.mwe-math-fallback-image-display, .mwe-math-element img');
    for(const img of imgs){
      const latex = img.getAttribute('alt');
      if(latex && latex.trim()) return latex.trim();
    }
    /* Also look for raw <math> tags (some articles use them directly). */
    const maths = doc.querySelectorAll('math annotation[encoding="application/x-tex"], math annotation');
    for(const a of maths){
      if(a.textContent && a.textContent.trim()) return a.textContent.trim();
    }
    return null;
  }catch(e){
    return null;
  }
}

/* ---- artwork: 4-tier image resolver.
   Tiers (each falls through to the next on failure):
     1. item.imageUrl       - hand-written direct URL (fastest path)
     2. item.commonsFile    - Commons filename, resolved via MediaWiki API
                              (follows redirects, returns verified thumb URL)
     3. Wikipedia summary   - lead image of the article in item.titles[0]
     4. Commons search      - fuzzy search Commons for item.name, use first hit
   Each tier's URL is also verified by actually loading the image - if the
   <img> onerror fires, the next tier runs automatically. This is why one
   failed artwork doesn't leave the card blank anymore. */
async function fillArtwork(card,list,item){
  const imgBox=card.querySelector('.artwork-image');

  function paintImage(src, onLoad, onFail){
    const img=document.createElement('img');
    img.alt=item.name;
    img.loading='lazy';
    img.referrerPolicy='no-referrer';
    /* attach handlers BEFORE setting src to avoid a cached-load race */
    img.onload = onLoad || null;
    img.onerror = onFail || null;
    img.src = src;
    imgBox.innerHTML='';
    imgBox.appendChild(img);
  }
  function showError(){
    imgBox.innerHTML='<span class="errline">Image unavailable.</span> '+
                     '<button class="retry">Retry</button>';
    setTimeout(()=>{
      const b=imgBox.querySelector('.retry');
      if(b) b.addEventListener('click',()=>{
        imgBox.innerHTML='<span class="loading">Loading…</span>';
        fillArtwork(card,list,item);
      });
    },0);
  }
  function showLoading(msg){
    imgBox.innerHTML='<span class="loading">'+esc(msg||'Loading…')+'</span>';
  }

  /* ---- Tier 2: Commons filename -> direct URL via MediaWiki API ----
     Returns a 1280-wide thumb URL. The API handles file renames via
     &redirects=1 so a historically-correct filename keeps working even if
     Commons renamed it. */
  async function resolveCommonsFile(filename){
    const f = filename.replace(/^File:/i,'').replace(/ /g,'_');
    const url = 'https://commons.wikimedia.org/w/api.php?' +
                'action=query&redirects=1&prop=imageinfo' +
                '&iiprop=url&iiurlwidth=1280&format=json&origin=*' +
                '&titles=File:' + encodeURIComponent(f);
    const r = await fetch(url);
    if(!r.ok) throw new Error('commons api http ' + r.status);
    const j = await r.json();
    const pages = j && j.query && j.query.pages;
    if(!pages) return null;
    for(const k in pages){
      const p = pages[k];
      if(p.missing !== undefined) return null;
      const info = p.imageinfo && p.imageinfo[0];
      if(info && (info.thumburl || info.url)) return info.thumburl || info.url;
    }
    return null;
  }

  /* ---- Tier 4: Commons search for item.name, return first file hit ---- */
  async function searchCommons(query){
    const url = 'https://commons.wikimedia.org/w/api.php?' +
                'action=query&list=search&srnamespace=6&srlimit=3&format=json&origin=*' +
                '&srsearch=' + encodeURIComponent(query + ' filemime:image/jpeg');
    const r = await fetch(url);
    if(!r.ok) throw new Error('commons search http ' + r.status);
    const j = await r.json();
    const hits = j && j.query && j.query.search || [];
    if(!hits.length) return null;
    /* resolve the first hit's filename -> URL */
    return await resolveCommonsFile(hits[0].title);
  }

  /* ---- Tier 3: Wikipedia summary lead image for item.titles[0] ---- */
  async function fromWikipedia(){
    const titles = item.titles || [item.name];
    const data = await fetchJSON(WIKI + encodeURIComponent(titles[0].replace(/ /g,'_')), true);
    if(data.__notfound) return null;
    return (data.originalimage && data.originalimage.source) ||
           (data.thumbnail && data.thumbnail.source) || null;
  }

  /* ---- try tiers in sequence, each verified by actually loading the img ---- */
  async function tryTiers(){
    const tiers = [];
    if(item.imageUrl)    tiers.push({label:'direct',       fn:()=>Promise.resolve(item.imageUrl)});
    if(item.commonsFile) tiers.push({label:'Commons file', fn:()=>resolveCommonsFile(item.commonsFile)});
    tiers.push({label:'Wikipedia',      fn:()=>fromWikipedia()});
    tiers.push({label:'Commons search', fn:()=>searchCommons(item.name)});

    for(let i=0;i<tiers.length;i++){
      let src;
      try{
        if(i>0) showLoading('Trying '+tiers[i].label+'…');
        src = await tiers[i].fn();
      }catch(e){ continue; }
      if(!src) continue;
      /* verify the URL actually loads (handlers attached before src is set) */
      const loaded = await new Promise(resolve=>{
        let done=false;
        const finish=(ok)=>{ if(!done){ done=true; resolve(ok); } };
        paintImage(src, ()=>finish(true), ()=>finish(false));
        /* safety: if neither fires within 15s treat as failure */
        setTimeout(()=>finish(false), 15000);
      });
      if(loaded) return;
    }
    showError();
  }

  showLoading('Loading…');
  tryTiers();
}

/* KaTeX loads deferred; on a cache-fast path a card can render first.
   Show raw TeX immediately, upgrade once the library arrives. */
function renderFormula(box,tex){
  box.style.display='';
  const paint=()=>{ try{katex.render(tex,box,{throwOnError:false,displayMode:true});}catch(e){box.textContent=tex;} };
  if(window.katex){ paint(); }
  else{
    box.textContent=tex;
    window.addEventListener('load',()=>{ if(window.katex) paint(); },{once:true});
  }
}
function showError(body,retryFn){
  body.innerHTML='<span class="errline">Couldn\u2019t load \u2014 check your connection.</span>'+
    '<button class="retry">Retry</button>';
  body.querySelector('.retry').addEventListener('click',()=>{
    body.innerHTML='<span class="loading">Gathering\u2026</span>';
    retryFn();
  });
}

/* ---------- chess board ---------- */
/* Each card with fen/pgn renders a board + controls:
     caption on top, board, [\u25c0 Back \u00b7 \u25b6 Fwd \u00b7 \u21bb Reset \u00b7 \u270e Play] controls, move label.
   Libraries (chessboard.js + jQuery + chess.js) load from CDN; if any fails
   to arrive, show a plain-text fallback instead of breaking the card. */
function renderChessBoard(container, item){
  const startFen = item.fen || 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1';
  const pgnMoves = parsePgn(item.pgn || '');

  /* caption */
  if(item.caption){
    const cap=document.createElement('p');
    cap.className='chess-caption';
    cap.textContent=item.caption;
    container.appendChild(cap);
  }

  /* board holder (chessboard.js needs a unique id) */
  const boardId='chess-'+Math.random().toString(36).slice(2,10);
  const boardDiv=document.createElement('div');
  boardDiv.className='chess-board';
  boardDiv.id=boardId;
  container.appendChild(boardDiv);

  /* controls */
  const ctl=document.createElement('div'); ctl.className='chess-controls';
  const btnBack=document.createElement('button'); btnBack.textContent='\u25c0 Back';
  const btnFwd =document.createElement('button'); btnFwd.textContent='Fwd \u25b6';
  const btnReset=document.createElement('button'); btnReset.textContent='\u21ba Reset';
  const btnPlay=document.createElement('button'); btnPlay.textContent='\u270e Play';
  ctl.appendChild(btnBack); ctl.appendChild(btnFwd); ctl.appendChild(btnReset);
  if(pgnMoves.length===0) ctl.appendChild(btnPlay); /* interactive-only mode when no PGN */
  else ctl.appendChild(btnPlay);
  container.appendChild(ctl);

  const label=document.createElement('div'); label.className='chess-movelabel';
  label.textContent=pgnMoves.length ? 'Start position' : 'Static position';
  container.appendChild(label);

  /* wait for libs to load, then initialise */
  waitForChessLibs().then(ready=>{
    if(!ready){
      /* fallback - show FEN and PGN as text */
      boardDiv.remove(); ctl.remove(); label.remove();
      const fb=document.createElement('div'); fb.className='chess-fallback';
      let msg='position: '+startFen;
      if(item.pgn) msg+='\nmoves: '+item.pgn;
      fb.textContent=msg;
      container.appendChild(fb);
      return;
    }

    let game=new Chess(startFen);
    let board=null;
    let cursor=0; /* 0 = startFen, 1..n = after move n */
    let interactive=false;

    function setup(fen, draggable){
      if(board) board.destroy();
      board=Chessboard(boardId, {
        position: fen,
        draggable: !!draggable,
        pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png',
        onDragStart: (src,piece)=>{
          if(game.game_over()) return false;
          if((game.turn()==='w' && piece.search(/^b/)===0) ||
             (game.turn()==='b' && piece.search(/^w/)===0)) return false;
        },
        onDrop: (src,tgt)=>{
          const mv=game.move({from:src,to:tgt,promotion:'q'});
          if(mv===null) return 'snapback';
          label.textContent='you played '+mv.san;
        },
        onSnapEnd: ()=>{ board.position(game.fen()); }
      });
    }

    function syncToCursor(){
      const g=new Chess(startFen);
      for(let i=0;i<cursor;i++){
        try{ g.move(pgnMoves[i]); }catch(e){ break; }
      }
      game=g;
      setup(game.fen(), interactive);
      if(cursor===0) label.textContent=pgnMoves.length?'Start position':'Static position';
      else label.textContent='after '+cursor+'. '+pgnMoves[cursor-1];
      btnBack.disabled = cursor===0;
      btnFwd.disabled  = cursor>=pgnMoves.length;
    }

    btnBack.addEventListener('click', ()=>{
      if(interactive) return;
      if(cursor>0){ cursor--; syncToCursor(); }
    });
    btnFwd.addEventListener('click', ()=>{
      if(interactive) return;
      if(cursor<pgnMoves.length){ cursor++; syncToCursor(); }
    });
    btnReset.addEventListener('click', ()=>{
      cursor=0; interactive=false;
      btnPlay.classList.remove('on'); btnPlay.textContent='\u270e Play';
      syncToCursor();
    });
    btnPlay.addEventListener('click', ()=>{
      interactive = !interactive;
      btnPlay.classList.toggle('on', interactive);
      btnPlay.textContent = interactive ? '\u270e Playing' : '\u270e Play';
      /* when entering play mode, keep current position; disable step buttons */
      btnBack.disabled = interactive || cursor===0;
      btnFwd.disabled  = interactive || cursor>=pgnMoves.length;
      if(interactive){
        label.textContent='your move \u2014 drag a piece';
        setup(game.fen(), true);
      } else {
        syncToCursor();
      }
    });

    syncToCursor();
  });
}

/* Parse a PGN move string like "1. e4 e5 2. Nf3 Nc6" into ["e4","e5","Nf3","Nc6"].
   Also handles black-only continuations like "4...d5". */
function parsePgn(pgn){
  if(!pgn) return [];
  /* remove move numbers (1. or 4...) and collapse whitespace */
  const cleaned = pgn.replace(/\d+\.(\.\.)?/g,' ').replace(/\s+/g,' ').trim();
  if(!cleaned) return [];
  return cleaned.split(' ').filter(x=>x && !/^(1-0|0-1|1\/2|\*)$/.test(x));
}

/* Poll briefly for chessboard.js, jQuery, and chess.js. */
function waitForChessLibs(){
  return new Promise(resolve=>{
    const t0=Date.now();
    (function tick(){
      if(window.jQuery && window.Chessboard && window.Chess) return resolve(true);
      if(Date.now()-t0 > 8000) return resolve(false);
      setTimeout(tick, 100);
    })();
  });
}

/* ---------- views ---------- */
let view='today', archiveDate=null;

function render(){
  const app=document.getElementById('app');
  app.innerHTML='';

  /* header */
  const header=document.createElement('header');
  header.innerHTML=
    '<div class="kicker">A Daily Digest</div>'+
    '<div class="masthead">Today\u2019s Learning</div>'+
    '<div class="date-line">'+esc(prettyDate(todayStr()))+'</div>'+
    '<div class="hr"></div>';
  app.appendChild(header);

  /* nav */
  const nav=document.createElement('nav');
  [['today','Today'],['archive','Archive'],['settings','Settings']].forEach(([v,label])=>{
    const b=document.createElement('button');
    b.textContent=label;
    if(view===v) b.classList.add('active');
    b.addEventListener('click',()=>{view=v;archiveDate=null;render();});
    nav.appendChild(b);
  });
  app.appendChild(nav);

  if(view==='today') renderDay(app,todayStr(),false);
  else if(view==='archive') renderArchive(app);
  else renderSettings(app);

  const f=document.createElement('footer');
  f.textContent='One item from each list, every day.';
  app.appendChild(f);
}

function renderDay(app,date,isArchive){
  if(isArchive){
    const back=document.createElement('button');
    back.className='back-btn';
    back.textContent='\u2190 Back to archive';
    back.addEventListener('click',()=>{archiveDate=null;render();});
    app.appendChild(back);
    const h=document.createElement('div');
    h.className='date-line';h.style.marginBottom='14px';
    h.textContent=prettyDate(date);
    app.appendChild(h);
  }
  /* Reference banner at the top: one formula/constant from the Reference list,
     deterministically rotated by date. Not a card, not in cooldown rotation. */
  renderReferenceBanner(app, date);

  const entry=computeDay(date);
  let any=false;
  /* appendWithSep: add a small ornamental separator before every card
     except the first, so cards read as members of a sequence rather than
     one wall of boxes. The .card-sep style is in the stylesheet. */
  function appendWithSep(cardNode){
    if(any){
      const sep=document.createElement('div');
      sep.className='card-sep';
      app.appendChild(sep);
    }
    app.appendChild(cardNode);
    any=true;
  }
  /* Render Quotes card first (right after Reference banner), then everything else. */
  const quotesList = LISTS.find(l=>l.id==='quotes');
  if(quotesList){
    for(const itemId of idsOf(entry,quotesList.id)){
      const item=getItem(quotesList,itemId);
      if(!item) continue;
      appendWithSep(cardEl(quotesList,item,date));
    }
  }
  for(const list of LISTS){
    if(list.id==='quotes') continue;
    for(const itemId of idsOf(entry,list.id)){
      const item=getItem(list,itemId);
      if(!item) continue;
      appendWithSep(cardEl(list,item,date));
    }
  }
  if(!any){
    const e=document.createElement('p');
    e.className='empty';
    e.textContent='No lists found. Add lists in lists.js.';
    app.appendChild(e);
  }
}

function renderArchive(app){
  if(archiveDate){ renderDay(app,archiveDate,true); return; }
  const days=state.history.slice().sort((a,b)=>a.date<b.date?1:-1);
  if(days.length<=1){
    const e=document.createElement('p');
    e.className='empty';
    e.textContent='Your past digests will appear here as the days go by.';
    app.appendChild(e);
    return;
  }
  days.forEach(h=>{
    if(h.date===todayStr()) return;
    const row=document.createElement('div');
    row.className='arch-row';
    let n=0; for(const k in h.picks) n+=idsOf(h,k).length;
    row.innerHTML='<span class="arch-date">'+esc(prettyDate(h.date))+'</span>'+
      '<span class="arch-meta">'+n+' item'+(n===1?'':'s')+' \u2192</span>';
    row.addEventListener('click',()=>{archiveDate=h.date;render();});
    app.appendChild(row);
  });
}

function renderReferenceBanner(app, date){
  /* Small banner at top of Today view - one formula/constant from the Reference
     list per day, rotating deterministically. Not a card. */
  const ref = (window.APP_LISTS||[]).find(l=>l.id==='reference');
  if(!ref || !ref.items || ref.items.length===0) return;
  const rng = mulberry32(hashStr(state.seed+'|'+date+'|reference|'+refreshSalt(date)));
  const item = ref.items[Math.floor(rng()*ref.items.length)];
  const banner = document.createElement('div');
  banner.className='ref-banner';
  const label = document.createElement('div');
  label.className='ref-banner-label';
  label.textContent = item.section ? item.section+' · '+item.name : item.name;
  banner.appendChild(label);
  if(item.formula){
    const f = document.createElement('div');
    f.className='ref-banner-formula';
    renderFormula(f, item.formula);
    banner.appendChild(f);
  } else if(item.value){
    const v = document.createElement('div');
    v.className='ref-banner-value';
    v.textContent = item.value;
    banner.appendChild(v);
  }
  app.appendChild(banner);
}

      row.appendChild(rm);
      s3.appendChild(row);
    });
  }
  app.appendChild(s3);

  /* weighting note */
  const s4=document.createElement('div');
  s4.className='set-sec';
  s4.innerHTML='<div class="set-h">How selection works</div>'+
    '<div class="set-p">Every draw halves a word\u2019s chance for the rest of the cycle, and '+
    'below 1x it goes inactive: normal words appear once, repeated words twice (2x then 1x), '+
    'starred normal twice, starred repeated three times (4x, 2x, 1x). When every word has used '+
    'its turns, the whole list returns. No word repeats within two weeks (starred excepted). '+
    'The daily word count is the list\u2019s total turns divided by 365, rounded up (currently '+
    'two; capped at five as the list grows). Wiki lists draw one item a day.</div>';
  app.appendChild(s4);

  /* hard refresh - force app code update */
  const s4b=document.createElement('div');
  s4b.className='set-sec';
  s4b.innerHTML='<div class="set-h">Hard refresh</div>'+
    '<div class="set-p">Forces the app to re-download the latest code from GitHub. '+
    'Use after I update the engine and iOS is still serving the cached version. '+
    'Keeps your history and favourites.</div>';
  const hb=document.createElement('button');
  hb.className='btn'; hb.textContent='Force app update';
  hb.addEventListener('click',async ()=>{
    /* Nuclear refresh for when the SW isn't yet in control (first install
       after we added it) or something has gone sideways. Multi-step:
         1. Clear ALL Cache Storage entries
         2. Tell the active SW to update + skip waiting, so any new sw.js
            on the server takes over immediately
         3. If no SW is yet controlling, unregister anything we can find
            and force the browser to re-register on reload
         4. Pre-fetch the critical files with cache:'reload' to pull fresh
            copies from the network into the browser cache
         5. Reload with a fresh ?v= cache-buster */
    hb.textContent='Refreshing…'; hb.disabled=true;
    try{
      if('caches' in window){
        const keys = await caches.keys();
        await Promise.all(keys.map(k=>caches.delete(k)));
      }
      if('serviceWorker' in navigator){
        const regs = await navigator.serviceWorker.getRegistrations();
        for(const r of regs){
          try{ await r.update(); }catch(_){}
          if(r.waiting) r.waiting.postMessage('skipWaiting');
          if(!navigator.serviceWorker.controller) await r.unregister();
        }
      }
      /* Force a network re-download of the core files so they land in the
         browser cache fresh, before we reload. */
      const bust = '?__b=' + Date.now();
      await Promise.all([
        fetch(window.location.pathname + bust, {cache:'reload'}).catch(()=>{}),
        fetch('lists.js' + bust, {cache:'reload'}).catch(()=>{}),
        fetch('sw.js' + bust, {cache:'reload'}).catch(()=>{})
      ]);
    }catch(e){/* keep going - we still reload */}
    const base = window.location.pathname;
    window.location.replace(base + '?v=' + Date.now());
  });
  s4b.appendChild(hb);
  app.appendChild(s4b);

  /* reset */
  const s5=document.createElement('div');
  s5.className='set-sec';
  s5.innerHTML='<div class="set-h">Reset</div>'+
    '<div class="set-p">Clears all history and favourites on this device. Cannot be undone.</div>';
  const rb=document.createElement('button');
  rb.className='btn danger'; rb.textContent='Reset everything';
  rb.addEventListener('click',()=>{
    if(confirm('Erase all history and favourites? This cannot be undone.')){
      localStorage.removeItem('dd_state');
      localStorage.removeItem('dd_cache');
      loadState(); saveState(); view='today'; render();
    }
  });
  s5.appendChild(rb);
  app.appendChild(s5);
}

/* ---------- export / import ---------- */
function exportData(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download='daily-digest-backup-'+todayStr()+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
document.getElementById('importer').addEventListener('change',function(ev){
  const file=ev.target.files[0];
  if(!file) return;
  const reader=new FileReader();
  reader.onload=function(){
    try{
      const data=JSON.parse(reader.result);
      if(typeof data!=='object'||!Array.isArray(data.history)) throw new Error('bad file');
      state=data;
      if(typeof state.seed!=='number') state.seed=Math.floor(Math.random()*4294967296);
      if(!state.stars) state.stars={};
      saveState();
      alert('Backup restored.');
      view='today'; render();
    }catch(e){ alert('That file could not be read as a Daily Digest backup.'); }
  };
  reader.readAsText(file);
  ev.target.value='';
});

/* ---------- go ---------- */
let renderedFor=null;
const _render=render;
render=function(){ renderedFor=todayStr(); _render(); };
function refreshIfNewDay(){
  if(todayStr()!==renderedFor){
    view='today'; archiveDate=null;
    computeDay(todayStr()); render();
  }
}
/* iOS resumes a home-screen app frozen; without this, yesterday's digest
   would stay on screen until a manual reload */
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) refreshIfNewDay(); });
window.addEventListener('focus',refreshIfNewDay);

/* ---- fullscreen image viewer: tap any card thumbnail to expand ---- */
document.addEventListener('click',function(ev){
  const thumb = ev.target.closest && ev.target.closest('.card-thumb');
  if(thumb){
    ev.preventDefault();
    openLightbox(thumb.getAttribute('data-full') || thumb.src);
    return;
  }
  /* artwork images - tap to view full-size */
  const art = ev.target.closest && ev.target.closest('.artwork-image img');
  if(art){
    ev.preventDefault();
    openLightbox(art.src);
  }
});
function openLightbox(src){
  const box = document.createElement('div');
  box.className = 'lightbox';
  box.innerHTML = '<button class="lightbox-close" aria-label="close">×</button>'+
                  '<img src="'+src.replace(/"/g,'&quot;')+'" alt="">';
  const close = ()=>{ if(box.parentNode) box.parentNode.removeChild(box); document.removeEventListener('keydown',onKey); };
  const onKey = (e)=>{ if(e.key==='Escape') close(); };
  box.addEventListener('click', close);
  document.addEventListener('keydown', onKey);
  document.body.appendChild(box);
}

loadState();
computeDay(todayStr());
render();

/* ---- Daily background painting ----
   A pool of atmospheric, public-domain artworks (Dadd, Martin, Fuseli,
   Waterhouse etc). One is chosen per day deterministically from the date
   hash, served from Wikimedia Commons via Special:FilePath so the URL
   handles file renames. The painting sits behind the parchment veil
   defined in body::before. */
(function pickDailyBackground(){
  /* Pool of paintings used as the day's background. Curated for a
     Midsummer-Night's-Dream / pre-Raphaelite / classical-Roman register
     - ethereal, romantic, dreamy. No horror / no funereal pieces. */
  const paintings = [
    /* Fairy / Shakespearean - the ethereal end */
    {file:"Titania Sleeping.jpg",                                                     artist:"Richard Dadd"},
    {file:"Richard Dadd - The Fairy Feller's Master-Stroke.jpg",                      artist:"Richard Dadd"},
    {file:"Joseph Noel Paton - The Reconciliation of Titania and Oberon.jpg",         artist:"Joseph Noel Paton"},
    {file:"Joseph Noel Paton - The Quarrel of Oberon and Titania - Google Art Project.jpg", artist:"Joseph Noel Paton"},
    /* Pre-Raphaelite / dreamy */
    {file:"John William Waterhouse - Hylas and the Nymphs (1896).jpg",                artist:"J W Waterhouse"},
    {file:"John William Waterhouse - The Lady of Shalott - Google Art Project.jpg",   artist:"J W Waterhouse"},
    {file:"John Everett Millais - Ophelia - Google Art Project.jpg",                  artist:"John Everett Millais"},
    {file:"Edward Burne-Jones - The Golden Stairs - Google Art Project.jpg",          artist:"Edward Burne-Jones"},
    /* Classical / Roman */
    {file:"The Roses of Heliogabalus.jpg",                                            artist:"Alma-Tadema"},
    {file:"Cole Thomas The Consummation The Course of the Empire 1836.jpg",           artist:"Thomas Cole"},
    /* Romantic landscape - atmospheric balance */
    {file:"Caspar David Friedrich - Wanderer above the Sea of Fog.jpeg",              artist:"C D Friedrich"}
  ];
  function urlFor(f){
    return 'https://commons.wikimedia.org/wiki/Special:FilePath/' +
           encodeURIComponent(f.replace(/ /g,'_')).replace(/'/g,'%27') +
           '?width=1600';
  }
  /* deterministic pick per day */
  const startIdx = Math.abs(hashStr(todayStr()+'|bgpaint')) % paintings.length;
  /* try the day's pick first, then walk the list until one actually loads.
     This insulates the background from any filename drift on Commons. */
  function tryLoad(step){
    if(step >= paintings.length) return; /* give up - cream wash alone */
    const chosen = paintings[(startIdx+step) % paintings.length];
    const url = urlFor(chosen.file);
    const probe = new Image();
    probe.onload = ()=>{
      document.body.style.setProperty('--bg-art', 'url("'+url+'")');
    };
    probe.onerror = ()=>{ tryLoad(step+1); };
    probe.src = url;
  }
  tryLoad(0);
})();

/* ---------- pull-to-refresh ----------
   When the user drags the top of the page downward past a threshold, bump
   today's refresh counter (which is mixed into the selection hash), wipe
   today's cached entry, and re-render. Gives genuinely new picks for today
   across every list and the Reference banner. Only fires on the Today view
   and only when page is scrolled to the very top. */
(function installPullToRefresh(){
  const THRESHOLD = 70;          /* px user must drag down to trigger */
  const MAX_PULL  = 120;          /* cap on visual translate */
  const indicator = document.createElement('div');
  indicator.className = 'pull-indicator';
  indicator.style.height = '48px';
  indicator.textContent = '↓  pull to refresh';
  document.body.appendChild(indicator);

  let startY = 0;
  let pulling = false;
  let currentPull = 0;

  function atTop(){ return (window.scrollY||document.documentElement.scrollTop||0) <= 0; }

  document.addEventListener('touchstart', (e)=>{
    if(view!=='today') return;
    if(!atTop()) return;
    if(e.touches.length !== 1) return;
    startY = e.touches[0].clientY;
    pulling = true;
    currentPull = 0;
    indicator.classList.remove('spinning');
    indicator.textContent = '↓  pull to refresh';
  }, {passive:true});

  document.addEventListener('touchmove', (e)=>{
    if(!pulling) return;
    const dy = e.touches[0].clientY - startY;
    if(dy <= 0){ pulling = false; indicator.style.transform='translateY(-100%)'; return; }
    currentPull = Math.min(dy * 0.6, MAX_PULL);
    const pct = Math.min(currentPull / THRESHOLD, 1);
    indicator.style.transform = 'translateY(' + (currentPull - 48) + 'px)';
    indicator.style.opacity = String(pct);
    indicator.textContent = (currentPull >= THRESHOLD) ? '↑  release to refresh' : '↓  pull to refresh';
  }, {passive:true});

  document.addEventListener('touchend', ()=>{
    if(!pulling) return;
    pulling = false;
    if(currentPull >= THRESHOLD){
      /* trigger refresh */
      indicator.style.transform = 'translateY(0px)';
      indicator.classList.add('spinning');
      indicator.textContent = 'refreshing…';
      setTimeout(()=>{
        const d = todayStr();
        state.refreshCounts[d] = (state.refreshCounts[d]||0) + 1;
        /* drop today's cached entry so computeDay recomputes */
        state.history = state.history.filter(h => h.date !== d);
        saveState();
        computeDay(d);
        render();
        /* hide indicator */
        setTimeout(()=>{
          indicator.classList.remove('spinning');
          indicator.style.transform = 'translateY(-100%)';
          indicator.style.opacity = '0';
        }, 180);
      }, 90);
    } else {
      indicator.style.transform = 'translateY(-100%)';
      indicator.style.opacity = '0';
    }
  });
})();

</script>
